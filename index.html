<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Charity: water</title>
</head>
<body>
    <!-- header -->
    <header class="header">
        <div class="container">
            <a href="https://www.charitywater.org/" class="logo">
                <img src="image/logo.svg" alt="charity: water logo">
            </a>

            <nav class="navigation">
                <ul>
                    <li><a href="https://www.charitywater.org/take-action">Take Action</a></li>
                    <li><a href="https://www.charitywater.org/about">About Us</a></li>
                    <li><a href="https://www.charitywater.org/global-water-crisis">Why Water?</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <a href="#https://www.charitywater.org/account/login" class="sign-in">Sign In</a>
                <a href="https://www.charitywater.org/donate" class="button button-yellow">Give 💧</a>
            </div>
        </div>
    </header>

    <main>
        <!-- Main page -->
        <section class="hero">
            <div class="hero-image">
                <img src="image/hero_picture.png" alt="A young girl reading a book near a source of clean water"
                >
            </div>

            <div class="hero-content">
                <h1>A dollar can help change someone's tomorrow.</h1>
                <h2>One dollar. A world of possibilities.</h2>

                <p>
                    Your $1 monthly donation helps bring clean water
                    to communities, giving people more time to learn,
                    work, and build healthier futures.
                </p>

                <a href="#donate" class="button button-yellow">
                    Give $1 Monthly
                </a>
            </div>
        </section>
    </main>
</body>
</html>
